name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze, format, unit tests, Pigeon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: dart pub get
      - name: Analyze
        run: tool/analyze.sh
      - name: Format (generated *.g.dart files are excluded)
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - name: Unit and widget tests (VM)
        run: tool/test.sh
      - name: Pigeon output is committed and up to date
        run: |
          tool/generate.sh
          git diff --exit-code

  web-tests:
    name: Web tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - name: flutter test --platform chrome
        working-directory: fl_place_autocomplete_web
        run: flutter test --platform chrome

  android:
    name: Android example build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - name: flutter build apk --debug
        working-directory: fl_place_autocomplete/example
        run: flutter build apk --debug
      - name: Kotlin unit tests (uses the Gradle wrapper generated by the build above)
        working-directory: fl_place_autocomplete/example/android
        run: ./gradlew :fl_place_autocomplete_android:testDebugUnitTest

  ios:
    name: iOS core tests and example build (SwiftPM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - run: dart pub get
      - name: FlPlaceAutocompleteCore unit tests
        working-directory: fl_place_autocomplete_ios
        run: tool/test_core.sh
      - name: No CocoaPods podspec
        run: test "$(find fl_place_autocomplete_ios -name '*.podspec' | wc -l)" -eq 0
      - name: flutter build ios --no-codesign --simulator
        working-directory: fl_place_autocomplete/example
        run: flutter build ios --no-codesign --simulator

  web:
    name: Web example build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - name: flutter build web
        working-directory: fl_place_autocomplete/example
        run: flutter build web
