name: Publish to pub.dev

# Tag format: <package_name>-v<version>, e.g. fl_place_autocomplete_android-v0.1.1
#             (pre-releases: fl_place_autocomplete-v0.2.0-beta.1)
# On pub.dev (package admin > Automated publishing > GitHub Actions), per package:
#   repository: kishormainali/fl_place_autocomplete
#   tag pattern: <package_name>-v{{version}}
#   environment: pub.dev
# Publish order matters: platform_interface -> android/ios/web -> fl_place_autocomplete.
# Push each tag only after its dependencies are live on pub.dev.
on:
  push:
    tags:
      - 'fl_place_autocomplete*-v[0-9]+.[0-9]+.[0-9]+'
      - 'fl_place_autocomplete*-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # ── 1. Resolve package/version from the tag and check it against pubspec ────
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        id: tag
        run: |
          PACKAGE="${GITHUB_REF_NAME%-v*}"
          VERSION="${GITHUB_REF_NAME##*-v}"
          PUBSPEC_VERSION="$(grep '^version:' "$PACKAGE/pubspec.yaml" | awk '{print $2}')"
          echo "Package: $PACKAGE  tag: $VERSION  pubspec: $PUBSPEC_VERSION"
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "❌  Tag version ($VERSION) does not match $PACKAGE/pubspec.yaml ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ── 2. Verify tests pass before publishing ──────────────────────────────────
  test:
    name: Verify tests
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: dart pub get

      - name: Analyze
        run: dart run melos run analyze

      - name: Run tests
        run: dart run melos run test

  # ── 3. Publish using OIDC (no stored credentials) ───────────────────────────
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [validate-version, test]

    # Must match the environment configured under:
    #   pub.dev package admin → Automated publishing → GitHub Actions
    environment: pub.dev

    permissions:
      id-token: write   # Required for OIDC token exchange with pub.dev
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Provisions the OIDC token pub.dev needs (exported as PUB_TOKEN). Must run
      # BEFORE the Flutter step: the Flutter SDK's `dart` shadows this one (needed
      # to publish Flutter packages) but reuses the token.
      - name: Set up Dart and pub.dev OIDC token
        uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: dart pub get

      - name: Publish - dry run
        working-directory: ${{ needs.validate-version.outputs.package }}
        run: dart pub publish --dry-run

      - name: Publish
        working-directory: ${{ needs.validate-version.outputs.package }}
        run: dart pub publish --force

  # ── 4. Create a GitHub Release for the tag ──────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, publish]

    permissions:
      contents: write   # Required to create a release via GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4

      # Pulls this version's section out of the package's CHANGELOG.md.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 == "## " ver || $0 == "## [" ver "]") { found=1; next }
              next
            }
            found { print }
          ' "${{ needs.validate-version.outputs.package }}/CHANGELOG.md" | sed '/^---$/d' > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "_No CHANGELOG.md entry found for $VERSION._" > release_notes.md
          fi
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Anything with a `-` after the version (e.g. -beta.1) is a pre-release.
          prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
