name: fl_place_autocomplete_android
description: "Android implementation of fl_place_autocomplete."
version: 0.1.0
repository: https://github.com/mk7/fl_place_autocomplete

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fl_place_autocomplete_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: fl_place_autocomplete
    platforms:
      android:
        package: com.mk7.fl_place_autocomplete_android
        pluginClass: FlPlaceAutocompleteAndroidPlugin
        dartPluginClass: FlPlaceAutocompleteAndroid
