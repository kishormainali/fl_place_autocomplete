name: fl_place_autocomplete
description: "Google Places autocomplete for Flutter, with a pure-Dart UI and native platform backends."
version: 0.1.0
repository: https://github.com/mk7/fl_place_autocomplete

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fl_place_autocomplete_platform_interface: ^0.1.0
  fl_place_autocomplete_android: ^0.1.0
  fl_place_autocomplete_ios: ^0.1.0
  fl_place_autocomplete_web: ^0.1.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  plugin:
    platforms:
      android:
        default_package: fl_place_autocomplete_android
      ios:
        default_package: fl_place_autocomplete_ios
      web:
        default_package: fl_place_autocomplete_web
