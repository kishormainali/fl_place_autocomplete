name: fl_place_autocomplete_workspace
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - fl_place_autocomplete
  - fl_place_autocomplete_platform_interface
  - fl_place_autocomplete_android
  - fl_place_autocomplete_ios
  - fl_place_autocomplete_web
dev_dependencies:
  melos: ^7.0.0
melos:
  scripts:
    generate:
      description: Regenerate Pigeon code (Dart + Kotlin + Swift)
      run: cd fl_place_autocomplete_platform_interface && dart run pigeon --input pigeons/messages.dart
    analyze:
      run: melos exec -- flutter analyze
    test:
      description: Run tests in every package that has a test dir
      run: melos exec --dir-exists=test -- flutter test
    publish:dry-run:
      description: Dry-run publish of every package, in dependency order
      run: for p in platform_interface android ios web; do (cd fl_place_autocomplete_$p && dart pub publish --dry-run) || exit 1; done; cd fl_place_autocomplete && dart pub publish --dry-run
    publish:
      description: Manually publish all packages in dependency order (confirms each; waits for you before dependents)
      run: |
        set -e
        for p in platform_interface android ios web; do
          (cd fl_place_autocomplete_$p && dart pub publish)
          if [ "$p" = platform_interface ]; then read -r -p "Wait until platform_interface is live on pub.dev, then press Enter: "; fi
        done
        read -r -p "Wait until android, ios and web are live on pub.dev, then press Enter: "
        cd fl_place_autocomplete && dart pub publish
    format:
      run: dart format .
